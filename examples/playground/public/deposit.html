<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>Send deposit</title>
    <style>
      :root {
        --bg: #0b0b0f;
        --card: #16161d;
        --fg: #f4f4f5;
        --muted: #a1a1aa;
        --accent: #3b82f6;
        --border: #27272a;
        --ok: #16a34a;
        --err: #dc2626;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 24px;
      }
      h1 { font-size: 20px; margin: 0 0 4px; }
      .sub { color: var(--muted); font-size: 14px; margin: 0 0 20px; }
      .row { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--border); font-size: 14px; }
      .row .k { color: var(--muted); }
      .row .v { font-weight: 600; text-align: right; word-break: break-all; }
      label { display: block; font-size: 13px; color: var(--muted); margin: 18px 0 6px; }
      input {
        width: 100%;
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: #0e0e13;
        color: var(--fg);
        font-size: 18px;
        outline: none;
      }
      button {
        width: 100%;
        margin-top: 18px;
        padding: 14px;
        border: 0;
        border-radius: 12px;
        background: var(--accent);
        color: #fff;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled { opacity: 0.5; cursor: default; }
      .msg { margin-top: 14px; font-size: 14px; word-break: break-all; }
      .msg.err { color: var(--err); }
      .msg.ok { color: var(--ok); }
      a { color: var(--accent); }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Confirm your deposit</h1>
      <p class="sub" id="sub">Send the amount below to complete funding.</p>

      <div class="row"><span class="k">Asset</span><span class="v" id="asset">—</span></div>
      <div class="row"><span class="k">Network</span><span class="v" id="network">—</span></div>
      <div class="row"><span class="k">To</span><span class="v" id="to">—</span></div>

      <label for="amount">Amount</label>
      <input id="amount" inputmode="decimal" placeholder="0.0" />

      <button type="button" id="send" disabled>Connect wallet</button>
      <div class="msg" id="msg"></div>
    </div>

    <script>
      'use strict'

      // --- params ---------------------------------------------------------
      const q = new URLSearchParams(location.search)
      const to = (q.get('to') || '').trim()
      const chainId = Number(q.get('chainId'))
      const token = (q.get('token') || '').trim() // empty => native
      const decimals = Number(q.get('decimals') || '18')
      const symbol = q.get('symbol') || (token ? 'TOKEN' : 'ETH')
      const chainName = q.get('chain') || (`Chain ${chainId}`)
      const presetAmount = q.get('amount') // base units (optional)

      const $ = (id) => document.getElementById(id)
      const isAddr = (a) => /^0x[0-9a-fA-F]{40}$/.test(a)

      // --- big-int decimal helpers (no deps) ------------------------------
      function toBaseUnits(human, dec) {
        const s = String(human).trim()
        if (!s || !/^\d*\.?\d*$/.test(s)) throw new Error('Invalid amount')
        const [whole, frac = ''] = s.split('.')
        const fracPadded = (frac + '0'.repeat(dec)).slice(0, dec)
        const combined = (whole || '0') + fracPadded
        return BigInt(combined.replace(/^0+(?=\d)/, ''))
      }
      function fromBaseUnits(base, dec) {
        const s = base.toString().padStart(dec + 1, '0')
        const whole = s.slice(0, s.length - dec)
        const frac = s.slice(s.length - dec).replace(/0+$/, '')
        return frac ? `${whole}.${frac}` : whole
      }
      const hex = (b) => `0x${b.toString(16)}`
      const pad32 = (h) => h.replace(/^0x/, '').padStart(64, '0')

      // --- render ---------------------------------------------------------
      $('asset').textContent = symbol
      $('network').textContent = chainName
      $('to').textContent = to ? `${to.slice(0, 8)}…${to.slice(-6)}` : '—'
      if (presetAmount) {
        try { $('amount').value = fromBaseUnits(BigInt(presetAmount), decimals) } catch (_) {}
      }

      const msg = (text, kind) => {
        const el = $('msg')
        el.textContent = text || ''
        el.className = `msg${kind ? ` ${kind}` : ''}`
      }

      function paramsValid() {
        if (!isAddr(to)) { msg('Missing or invalid deposit address.', 'err'); return false }
        if (!Number.isFinite(chainId) || chainId <= 0) { msg('Missing or invalid chain.', 'err'); return false }
        if (token && !isAddr(token)) { msg('Invalid token address.', 'err'); return false }
        return true
      }

      const eth = window.ethereum
      const btn = $('send')

      if (!eth) {
        msg('Open this page inside your wallet app’s browser (MetaMask, Rabby, Trust, …).', 'err')
        btn.textContent = 'No wallet detected'
      } else if (paramsValid()) {
        btn.disabled = false
        btn.textContent = `Send ${symbol}`
      }

      // --- send -----------------------------------------------------------
      async function send() {
        msg('')
        btn.disabled = true
        try {
          let amount
          try { amount = toBaseUnits($('amount').value, decimals) } catch (e) { throw new Error('Enter a valid amount.') }
          if (amount <= 0n) throw new Error('Enter an amount greater than zero.')

          const accounts = await eth.request({ method: 'eth_requestAccounts' })
          const from = accounts?.[0]
          if (!from) throw new Error('No account in wallet.')

          await eth.request({
            method: 'wallet_switchEthereumChain',
            params: [{ chainId: hex(BigInt(chainId)) }],
          }).catch((e) => {
            if (e && e.code === 4902) throw new Error(`Add ${chainName} to your wallet first.`)
          })

          // balance guard — avoid a reverted tx that strands the deposit
          let balance
          if (token) {
            const data = `0x70a08231${pad32(from)}`
            const res = await eth.request({ method: 'eth_call', params: [{ to: token, data }, 'latest'] })
            balance = BigInt(res || '0x0')
          } else {
            balance = BigInt(await eth.request({ method: 'eth_getBalance', params: [from, 'latest'] }))
          }
          if (balance < amount) {
            throw new Error(`Not enough ${symbol} — you have ${fromBaseUnits(balance, decimals)}.`)
          }

          let txHash
          if (token) {
            const data = `0xa9059cbb${pad32(to)}${pad32(hex(amount))}`
            txHash = await eth.request({ method: 'eth_sendTransaction', params: [{ from, to: token, data }] })
          } else {
            txHash = await eth.request({ method: 'eth_sendTransaction', params: [{ from, to, value: hex(amount) }] })
          }

          msg(`Sent! You can return to the app — your balance will update shortly. ${txHash || ''}`, 'ok')
          btn.textContent = 'Sent ✓'
        } catch (e) {
          if (e && e.code === 4001) { msg('Cancelled.', null) }
          else { msg((e && (e.shortMessage || e.message)) || 'Transaction failed.', 'err') }
          btn.disabled = false
        }
      }

      btn.addEventListener('click', send)
    </script>
  </body>
</html>
