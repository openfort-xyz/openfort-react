name: Tests
on:
  pull_request:
    branches:
      - main
  merge_group:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Run unit tests with coverage
        # `CI` is set by GitHub Actions, which switches the vitest coverage
        # reporter to lcov.
        run: pnpm test:cov
        working-directory: packages/openfort-react

      - name: Upload coverage report
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: ${{ !cancelled() }}
        with:
          name: coverage-lcov
          path: packages/openfort-react/coverage/lcov.info
          retention-days: 30

      - name: Install Playwright Browsers
        run: pnpm playwright install --with-deps
        working-directory: examples/playground

      - name: Run Playwright tests
        env:
          VITE_OPENFORT_PUBLISHABLE_KEY: ${{ vars.VITE_OPENFORT_PUBLISHABLE_KEY }}
          VITE_SHIELD_PUBLISHABLE_KEY: ${{ vars.VITE_SHIELD_PUBLISHABLE_KEY }}
          VITE_FEE_SPONSORSHIP_ID: ${{ vars.VITE_FEE_SPONSORSHIP_ID }}
          VITE_CREATE_ENCRYPTED_SESSION_ENDPOINT: ${{ vars.VITE_CREATE_ENCRYPTED_SESSION_ENDPOINT }}
          VITE_BEAM_MINT_CONTRACT: ${{ vars.VITE_BEAM_MINT_CONTRACT }}
          VITE_POLYGON_MINT_CONTRACT: ${{ vars.VITE_POLYGON_MINT_CONTRACT }}
        run: pnpm test
        working-directory: examples/playground

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 30
