name: Run pnpm build
on:
    pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pnpm-build:
    name: pnpm build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # packages: read    # required for pulling packages from GHCR

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security audit
        # npm retired the audit endpoint this hits (HTTP 410), so `pnpm audit`
        # now fails on every run regardless of dependencies. Keep the step for
        # visibility but don't let the dead endpoint block CI.
        run: pnpm audit
        continue-on-error: true

      - name: Code check (Biome)
        run: pnpm biome check

      - name: Check TypeScript types
        run: pnpm check:types

      - name: Check for unused files and exports
        run: pnpm check:unused

      - name: Build project
        run: pnpm build

