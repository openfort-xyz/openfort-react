name: Run pnpm build
on:
    pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          # Full clone so the BASE_SHA..HEAD range below is resolvable; the
          # scan itself covers only the commits this run introduces.
          fetch-depth: 0

      # The gitleaks binary is used directly rather than gitleaks-action, which
      # requires a paid licence for organisation-owned repositories. Rules come
      # from .gitleaks.toml, which extends the default ruleset.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          # Pinned checksum of the release asset; a substituted binary would
          # otherwise execute as the CI user on every PR.
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar -xz -C /usr/local/bin -f gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz
          gitleaks version

      # Only the commits this run introduces are scanned. A full-history scan
      # would fail on pre-existing findings unrelated to the change. Run
      # `pnpm scan:secrets` locally for the staged-change equivalent.
      - name: Scan for secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            RANGE="$BASE_SHA..HEAD"
          else
            RANGE="HEAD~1..HEAD"
          fi
          echo "Scanning $RANGE"
          gitleaks git --redact -v --exit-code 1 --log-opts="$RANGE"

  pnpm-build:
    name: pnpm build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # packages: read    # required for pulling packages from GHCR

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security audit
        # `--ignore-registry-errors` exits 0 when the registry itself is
        # unreachable, so a registry outage cannot fail the build while a real
        # advisory still can. Known-debt advisories are allowlisted with
        # justifications under `auditConfig` in pnpm-workspace.yaml; anything
        # outside that allowlist fails here.
        run: pnpm audit --ignore-registry-errors

      - name: sherif
        run: pnpm check:repo

      - name: Code check (Biome)
        run: pnpm biome check

      - name: Check TypeScript types
        run: pnpm check:types

      - name: Check CLI (tsc + Biome)
        run: pnpm check:cli

      - name: Run CLI unit tests
        run: pnpm test:cli

      - name: Check quickstart example
        run: pnpm check:quickstarts

      - name: Check for unused files and exports
        run: pnpm check:unused

      - name: Build project
        run: pnpm build

      - name: Build CLI
        run: pnpm build:cli

      - name: Check publishable packages (publint + attw)
        run: pnpm test:build

      # publint and attw inspect packaging metadata and declarations; neither
      # resolves the exports map or evaluates the output. These workspaces
      # consume the built package the way a dependent project does.
      - name: Consume the built package (tsc + node)
        run: pnpm test:env

      - name: Check bundle-size budgets
        run: pnpm size

  types:
    name: Types (React ${{ matrix.react-version }}, viem ${{ matrix.viem-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      # One failing combination is a useful signal on its own, so let the rest
      # finish and report.
      fail-fast: false
      matrix:
        # Both ends of the supported peer range.
        react-version: ['18', '19']
        # The version the lockfile resolves to, plus whatever consumers get
        # today, so a breaking viem release surfaces here first.
        viem-version: ['2.52.2', 'latest']
        # TypeScript is not an axis here: the build type-checks through
        # rollup-plugin-typescript2, which needs the JavaScript implementation
        # of TypeScript, and TypeScript 7 ships only the native port.

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install matrix versions
        # `pnpm.overrides` pins react and viem for every workspace project, so
        # those pins have to go before the matrix versions can take effect.
        # React is installed into the package workspace because that is where
        # the typecheck resolves its react types from.
        run: |
          node -e "
            const fs = require('fs')
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
            for (const name of ['react', 'react-dom', '@types/react', '@types/react-dom', 'viem'])
              delete pkg.pnpm.overrides[name]
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2))
          "
          pnpm add -D -w viem@${{ matrix.viem-version }}
          pnpm --filter @openfort/react add -D \
            react@${{ matrix.react-version }} \
            react-dom@${{ matrix.react-version }} \
            @types/react@${{ matrix.react-version }} \
            @types/react-dom@${{ matrix.react-version }}

      - name: Check types
        # rollup-plugin-typescript2 type-checks the package sources as it
        # builds, so a type error under this react/viem pair fails the job.
        run: pnpm build
