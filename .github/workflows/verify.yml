name: Run pnpm build
on:
    pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pnpm-build:
    name: pnpm build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # packages: read    # required for pulling packages from GHCR

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security audit
        # `--ignore-registry-errors` exits 0 when the registry itself is
        # unreachable, so a registry outage cannot fail the build while a real
        # advisory still can. Known-debt advisories are allowlisted with
        # justifications under `auditConfig` in pnpm-workspace.yaml; anything
        # outside that allowlist fails here.
        run: pnpm audit --ignore-registry-errors

      - name: Code check (Biome)
        run: pnpm biome check

      - name: Check TypeScript types
        run: pnpm check:types

      - name: Check for unused files and exports
        run: pnpm check:unused

      - name: Build project
        run: pnpm build

