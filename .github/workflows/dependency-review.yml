name: 'Dependency Review'
on: [pull_request]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: 'Dependency Review'
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          comment-summary-in-pr: on-failure
          fail-on-severity: moderate
          license-check: false
          # The fixed markdown-it 14.3.3 was published on 2026-10-16 and remains
          # inside the seven-day cooldown; it reaches only typedoc. Remove this
          # on 2026-10-23.
          allow-ghsas: GHSA-gfr2-rv44-r23c, GHSA-vfgh-jcmw-g37q
