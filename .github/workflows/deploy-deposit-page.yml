name: Deploy deposit page

# Publishes the static deposit "send" page (hosted/deposit-page) to Cloudflare
# Pages. The page backs the Deposit hub's mobile wallet deeplinks and is served
# at https://deposit.openfort.io (the SDK's default depositPageUrl).

on:
  push:
    branches: [main]
    paths:
      - 'hosted/deposit-page/**'
      - '.github/workflows/deploy-deposit-page.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-deposit-page
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy hosted/deposit-page to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Static upload, no build step. --branch=main marks it the production
          # deployment, which the deposit.openfort.io custom domain points at.
          command: pages deploy hosted/deposit-page --project-name=openfort-deposit-page --branch=main
