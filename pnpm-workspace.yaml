  '@tanstack/query-core': ^5.99.2
  use-sync-external-store: ^1.6.0
  typescript: ^5.9.3
  protobufjs: '>=8.6.6'
  follow-redirects: '>=1.16.1'
  '@hono/node-server': '>=2.0.10'
  cross-spawn: '>=6.0.6'
  got: '>=11.8.5'
  esbuild: '>=0.28.1'
  browserslist@<4.28.7: '>=4.28.7'
  glob@>=10.3.7 <=11.0.3: '>=11.1.0'
